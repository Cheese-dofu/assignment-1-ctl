<script>

    document.getElementById("myText").style.color = "blue";
// Show saved response when the page loads
window.onload = function () {
    let saved = localStorage.getItem("savedResponse");
    if (saved) {
        document.getElementById("result").textContent = saved;
    }
};

function checkInput() {
    let input = document.getElementById("userInput").value;
    let response = "";

    if (input.toLowerCase() === "pink-fluffy-unicorn") {
        response = "dancing on rainbows!";
    } else {
        response = "";
    }

    // Show response
    document.getElementById("result").textContent = response;

    // Save response in browser
    localStorage.setItem("savedResponse", response);
}
