    <h1>Current Time</h1>
<p id="clock"></p>

<script>
function updateTime() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString();
}

// Update immediately
updateTime();

// Update every second
setInterval(updateTime, 1000);
</script>

   
<h2>Private Notes</h2>

<textarea id="note" rows="8" cols="50" placeholder="Write your note here..."></textarea>
<br><br>

<button onclick="saveNote()">Save</button>

<script>
const note = document.getElementById("note");

// Load saved note when the page opens
note.value = localStorage.getItem("myPrivateNote") || "";

// Save the note
function saveNote() {
    localStorage.setItem("myPrivateNote", note.value);
    alert("Note saved!");
}
</script>
