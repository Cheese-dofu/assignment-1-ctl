    <h1>Current Time</h1>
<p id="clock"></p>

<script>
function updateTime() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString();
}

// Update immediately
updateTime();

// Update every second
setInterval(updateTime, 1000);
</script>
