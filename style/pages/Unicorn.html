<h1>How Do you feel about Ai,or Ai are type how you feel below</h1>

<textarea id="notes" placeholder="Write your private notes here..."></textarea>
<br>
<button onclick="saveNotes()">Save Notes</button>

<p id="status"></p>

<script>
const notes = document.getElementById("notes");
const status = document.getElementById("status");

// Load saved notes when the page opens
window.onload = function () {
    const saved = localStorage.getItem("privateNotes");
    if (saved) {
        notes.value = saved;
    }
};

// Save notes
function saveNotes() {
    localStorage.setItem("privateNotes", notes.value);
    status.textContent = "Notes saved!";
}
</script>
