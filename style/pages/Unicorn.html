   <title> Ai Art vs Human Art</title>
      <style>
        body { font-family: sans-serif; margin: 40px;
        background-color: black; }
        .container { max-width: 400px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; }
        button { padding: 10px 15px; cursor: pointer; }
        
    </style>
</head>
<body>

<div class="container">
    <label for="answerField">Type your answer:</label>
    <!-- 1. The HTML Text Box -->
    <input type="text" id="answerField" placeholder="Your answer will be saved...">
    
    <!-- 2. The Save Button -->
    <button onclick="saveAnswer()">Save Answer</button>
</div>

<script>
    // 3. Load the saved answer when the page opens
    window.onload = function() {
        const savedValue = localStorage.getItem("userAnswer");
        if (savedValue) {
            document.getElementById("answerField").value = savedValue;
        }
    };

    // 4. Save the answer to the browser's memory
    function saveAnswer() {
        const inputField = document.getElementById("answerField");
        localStorage.setItem("userAnswer", inputField.value);
        alert("Answer saved successfully!");
        
    }
</script>


</body>
