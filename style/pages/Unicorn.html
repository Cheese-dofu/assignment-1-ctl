    <h1>Which image is ai</h1>
<div id="question"></div>
<button onclick="checkAnswer('Yes')">Yes</button>
<button onclick="checkAnswer('No')">No</button>

<h3 id="feedback"></h3>
<h3 id="score">Score: 0</h3>
<script>
const quiz =[
   
  { 
  question:"Is this image ai?", 
  answer: "No",
},
];
let currentQuestion = 0;
let score = 0;

window.onload = () => {
    showQuestion();
    console.log('test');
}

function showQuestion() {
    document.getElementById("question").innerHTML =
        quiz[currentQuestion].question;
    let img = document.createElement('img');
    img.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgEVDhbfBjFAkacOPSh5JqVOrJzuT0vwojUgPPC8kgULJCixPOZzd-Kb4&s=10";
    document.getElementById('question').appendChild(img);
}

function checkAnswer(choice) {

    if (choice === quiz[currentQuestion].answer) {
        score++;
        document.getElementById("feedback").textContent = "✅ Correct!";
    } else {
        document.getElementById("feedback").textContent = "❌ Incorrect!";
    }

    document.getElementById("score").textContent = "Score: " + score;

    currentQuestion++;

    if (currentQuestion < quiz.length) {
        setTimeout(() => {
            document.getElementById("feedback").textContent = "";
            showQuestion();
        }, 1000);
    } else {
        setTimeout(() => {
            document.body.innerHTML = `
                <h1>Quiz Finished!</h1>
                <h2>Your Score: ${score} / ${quiz.length}</h2>
            `;
        }, 1000);
    }
}







</script>
